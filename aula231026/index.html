<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Teste de Formulário</title>
    <link rel='stylesheet' href='main.css'>

<style>
    table {
        border-collapse: collapse;
        width: 100%;
        
    }

    th, td { 
        border: 3px solid #ddd;
        padding: 8px;
        text-align: left;
        color: red;
        
    }

    th {
        background-color: #f2f2f2;
        color: blue;
    }
</style>

<body style="background-image: url('img/ifsc.png'); background-size: 50%; background-position: center; background-repeat: no-repeat;">


</head>



<body >
    
    <form action="historico.html" method="post">
        <label for="nome" style="color: blue;">Nome:</label>
        <input type="text" id="nome" name="nome" required >
        <label for="sobrenome" style="color: blue;">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome" required>
        <label for="email" style="color: blue;" >Email:</label>
        <input type="email" id="email" name="email" required > 
        <label for="telefone" style="color: blue;">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>   
        <label for="idade" style="color: blue;">Idade:</label>
        <input id="idade" name="idade" required type="number" min="16" max="120">
        <label for="nascimento" style="color: blue;">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>
        <label for="curso" style="color: blue;">Cursos:</label>
        <select id="curso" name="curso" style="color: red;" required>
            <option value="" style="color: red  ;">Selecione</option>
            <option value="informatica" style="color: red;">Informática</option>
            <option value="pedagogia" style="color: red;">Pedagogia</option>
            <option value="quimica" style="color: red;">Química</option>
            <option value="mecanica" style="color: red;">Mecânica</option>
            <option value="eletrica" style="color: red;">Elétrica</option>
        </select>
        <input type="submit" value="Enviar" style="background-color: blue; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer;">

        
    </form>

    <table>
        <caption >Informações dos Atendimentos</caption>
        <thead>
            <tr>
                <th scope="col">Dia</th>
                <th scope="col">Horário</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Segunda-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
            <tr>
                <th scope="row">Terça-feira</th>
                <td>14:00 - 18:00</td>
            </tr>
            <tr>
                <th scope="row">Quarta-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
            <tr>
                <th scope="row">Quinta-feira</th>
                <td>14:00 - 18:00</td>
            </tr>
            <tr>
                <th scope="row">Sexta-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
        </tbody>
    </table>




</body>
</html>
        
</html>
