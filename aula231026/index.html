<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Teste de Formulário</title>
    <link rel='stylesheet' href='main.css'>

<style>
    table {
        border-collapse: collapse;
        width: 50%;
        margin-top: 20px;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }

    th {
        background-color: #f2f2f2;
    }
</style>


</head>



<body style="background-color: #e9f1ff; color: #1f1f1f;">
    
    <form action="historico.html" method="post">
        <label for="nome" >Nome:</label>
        <input type="text" id="nome" name="nome" required >
        <label for="sobrenome" style="color: blue;">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome" required>
        <label for="email" style="color: blue;" >Email:</label>
        <input type="email" id="email" name="email" required > 
        <label for="telefone" style="color: blue;">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>   
        <label for="idade" style="color: blue;">Idade:</label>
        <input id="idade" name="idade" required type="number" min="16" max="120">
        <label for="nascimento" style="color: blue;">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>
        <label for="curso" style="color: blue;">Cursos:</label>
        <select id="curso" name="curso" required>
            <option value="">Selecione</option>
            <option value="informatica">Informática</option>
            <option value="pedagogia">Pedagogia</option>
            <option value="quimica">Química</option>
            <option value="mecanica">Mecânica</option>
            <option value="eletrica">Elétrica</option>
        </select>
        <input type="submit" value="Enviar" style="background-color: blue; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer;">

        
    </form>

    <table>
        <caption>Informações dos Atendimentos</caption>
        <thead>
            <tr>
                <th scope="col">Dia</th>
                <th scope="col">Horário</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Segunda-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
            <tr>
                <th scope="row">Terça-feira</th>
                <td>14:00 - 18:00</td>
            </tr>
            <tr>
                <th scope="row">Quarta-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
            <tr>
                <th scope="row">Quinta-feira</th>
                <td>14:00 - 18:00</td>
            </tr>
            <tr>
                <th scope="row">Sexta-feira</th>
                <td>08:00 - 12:00</td>
            </tr>
        </tbody>
    </table>




</body>
</html>
        
</html>
