<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>CARD</title>

    <style>
        * {
            box-sizing: border-box;
        }
    
         .card{
            position: fixed;
            background-color: white;
            width: 400px;
            height: 400px;
            border: 1px solid black;
            border-radius: 20px;
            text-align: center;
            margin: 50px ;
            margin-top: 50px;
        }
   
        .card-descricao{
            font-size: 20px;
            color: black;
            margin-top: 20px;
            background-color: green;
            display: inline-block;
            border-radius: 8px;
            border: 2px solid black;
            padding: 24px 50px;
        }

        .selo{
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 20px;
            color: black;
            margin-top: 20px;
            background-color: green;
            display: inline-block;
            border-radius: 8px;
            border: 2px solid black;
            padding: 24px 50px;
          

        }

    </style>


</head>
<body>
   
    <section class="card">
        <!-- <h2 class="card-titulo" > CARD de Produtos </h2> -->
       <!-- <button class="card-descricao" >Comprar </button>-->  
        <button class="selo" >Carrinho </button>
    </section>
</body>
</html>
